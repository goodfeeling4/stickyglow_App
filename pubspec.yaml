name: sticky_notes_ssh
description: "Offline-first Android Sticky Notes app with SSH/SFTP sync to Linux laptop"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # SSH & SFTP
  dartssh2: ^2.10.0

  # Local Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Background Sync
  workmanager: ^0.5.2
  connectivity_plus: ^6.1.1

  # UI
  flutter_staggered_grid_view: ^0.7.0
  provider: ^6.1.2
  share_plus: ^10.1.4

  # Utilities
  diff_match_patch: ^0.4.1
  crypto: ^3.0.6
  intl: ^0.19.0
  uuid: ^4.5.1
  pinenacl: ^0.6.0
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
